version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: smartspace-db-prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: smartspace
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./infra/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - smartspace_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: smartspace-backend:latest
    container_name: smartspace-backend-prod
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:mysql://mysql:3306/smartspace?useSSL=false&allowPublicKeyRetrieval=true
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TTL_MIN=15
      - JWT_REFRESH_TTL_DAYS=7
      - OTP_PEPPER=${OTP_PEPPER}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    ports:
      - "8080:8080"
    networks:
      - smartspace_net

  frontend:
    image: smartspace-frontend:latest
    container_name: smartspace-frontend-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VITE_API_URL=${FRONTEND_API_URL}
    networks:
      - smartspace_net

volumes:
  db_data:

networks:
  smartspace_net:
    driver: bridge
