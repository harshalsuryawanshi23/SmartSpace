spring:
  datasource:
    url: jdbc:mysql://localhost:3306/smartspace?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: false

app:
  jwt:
    secret: dev-local-jwt-secret-key-at-least-32-bytes-long-for-hmac
    access-ttl-minutes: 60
    refresh-ttl-days: 30
  security:
    otp-pepper: dev-otp-pepper-local

logging:
  level:
    root: INFO
    com.smartspace: DEBUG
